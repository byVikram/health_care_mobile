name: Mobile CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # --ignore-scripts: the husky "prepare" hook has nothing to do on CI.
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Lint
        # Errors fail the job; warnings (the existing backlog) are reported only.
        run: npm run lint

